<!-- Topbar Navigation — Falcon-inspired horizontal layout -->
<nav class="topbar navbar navbar-expand-lg">
    <div class="container-fluid px-3 px-lg-4">

        <!-- Row 1: Logo + Hamburger + Right Actions -->
        <div class="d-flex align-items-center w-100">

            <!-- Logo -->
            <a class="navbar-brand d-flex align-items-center me-4 text-decoration-none" routerLink="/dashboard">
                <img src="img/logo-dgtcp.png" alt="DGTCP" class="brand-logo me-2" />
                <span class="fs-5 fw-bold text-white tracking-tight">SYGACUT-BI</span>
            </a>

            <!-- Desktop Navigation (inline on lg+) -->
            <div class="collapse navbar-collapse" id="topbarNavCollapse">
                <ul class="navbar-nav me-auto gap-1">
                    <!-- Dashboard -->
                    <li class="nav-item">
                        <a class="nav-link px-3 py-2 rounded-2" routerLink="/dashboard" routerLinkActive="active"
                            [routerLinkActiveOptions]="{exact: true}">
                            <i class="fas fa-chart-pie me-2"></i>Tableau de Bord
                        </a>
                    </li>

                    <!-- Services Dropdown -->
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle px-3 py-2 rounded-2" href="#" role="button"
                            data-bs-toggle="dropdown" aria-expanded="false" [class.active]="isServicesActive">
                            <i class="fas fa-layer-group me-2"></i>Services
                        </a>
                        <div class="dropdown-menu dropdown-menu-services border-0 shadow-lg mt-1 rounded-3 py-2">
                            @for (item of serviceItems; track item.path) {
                            <a class="dropdown-item d-flex align-items-center px-3 py-2" [routerLink]="item.path"
                                routerLinkActive="active-item">
                                <i [class]="item.icon + ' me-3 text-secondary'"
                                    style="width: 18px; text-align: center;"></i>
                                <span class="fw-medium">{{ item.label }}</span>
                            </a>
                            }
                        </div>
                    </li>

                    <!-- Administration -->
                    <!-- <li class="nav-item">
                        <a class="nav-link px-3 py-2 rounded-2" routerLink="/admin" routerLinkActive="active">
                            <i class="fas fa-cog me-2"></i>Administration
                        </a>
                    </li> -->
                </ul>
            </div>

            <!-- Right Side Actions -->
            <div class="d-flex align-items-center gap-2 gap-md-3 ms-auto">

                <!-- Global Period (Desktop) -->
                <div class="d-none d-xl-flex align-items-center bg-white bg-opacity-10 px-3 py-1 rounded-pill">
                    <i class="far fa-calendar-alt text-white-50 me-2"></i>
                    <span class="fs-7 fw-medium text-white">Mars 2026</span>
                </div>

                <!-- Theme Toggle -->
                <button class="topbar-action-btn" (click)="toggleTheme()"
                    [title]="isDarkMode ? 'Mode clair' : 'Mode sombre'">
                    <i class="fs-6" [class.fas]="true" [class.fa-sun]="isDarkMode" [class.fa-moon]="!isDarkMode"></i>
                </button>

                <!-- Notifications -->
                <button class="topbar-action-btn position-relative">
                    <i class="far fa-bell fs-6"></i>
                    @if (notificationCount > 0) {
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                        style="font-size: 0.6rem; padding: 0.2em 0.45em;">
                        {{ notificationCount }}
                    </span>
                    }
                </button>

                <!-- User Profile Dropdown -->
                <div class="dropdown">
                    <button class="topbar-user-btn d-flex align-items-center gap-2" data-bs-toggle="dropdown"
                        aria-expanded="false">
                        <div class="avatar-circle">
                            {{ userProfile?.firstName?.charAt(0) || 'U' }}{{ userProfile?.lastName?.charAt(0) || '' }}
                        </div>
                        <div class="d-none d-md-flex align-items-center">
                            <span class="fs-7 fw-bold text-white me-1">Mon Profil</span>
                            <i class="fas fa-chevron-down fs-9 text-white-50"></i>
                        </div>
                    </button>

                    <ul class="dropdown-menu dropdown-menu-end shadow-lg border-0 mt-2 rounded-3 py-2">
                        <li>
                            <div class="px-3 py-2 d-md-none border-bottom mb-2">
                                <div class="fw-bold fs-7">{{ userProfile?.firstName }} {{ userProfile?.lastName }}</div>
                                <div class="text-secondary fs-8">{{ userProfile?.username }}</div>
                            </div>
                        </li>
                        <li><a class="dropdown-item py-2 px-3 fw-medium" routerLink="/profil">
                                <i class="far fa-user me-2 text-secondary"></i> Mon Profil</a></li>
                        <li><a class="dropdown-item py-2 px-3 fw-medium" href="#">
                                <i class="fas fa-cog me-2 text-secondary"></i> Paramètres</a></li>
                        <li>
                            <hr class="dropdown-divider my-2">
                        </li>
                        <li><button class="dropdown-item py-2 px-3 fw-medium text-danger" (click)="logout()">
                                <i class="fas fa-sign-out-alt me-2"></i> Déconnexion</button></li>
                    </ul>
                </div>

                <!-- Mobile Hamburger Toggle -->
                <button class="navbar-toggler d-lg-none ms-1" type="button" data-bs-toggle="collapse"
                    data-bs-target="#topbarNavCollapse" aria-controls="topbarNavCollapse" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <i class="fas fa-bars text-white fs-5"></i>
                </button>
            </div>
        </div>
    </div>
</nav>
